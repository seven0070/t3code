<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT - Chat & Advanced Voice Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                dark: "#212121",
                sidebar: "#171717",
                surface: "#2f2f2f",
                border: "#3c3c3c",
                hover: "#2a2a2a",
                text: "#ececec",
                subtext: "#b4b4b4",
              },
            },
            fontFamily: {
              sans: [
                "Söhne",
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #424242;
        border-radius: 9999px;
      }
      .voice-glow {
        box-shadow:
          0 0 120px 40px rgba(59, 130, 246, 0.15),
          0 0 200px 80px rgba(168, 85, 247, 0.1);
      }
    </style>
  </head>
  <body
    class="bg-[#212121] text-[#ececec] font-sans antialiased h-screen overflow-hidden flex select-none"
  >
    <!-- SIDEBAR -->
    <aside
      id="sidebar"
      class="w-64 bg-[#171717] flex-shrink-0 flex flex-col justify-between p-3 border-r border-[#262626] transition-all duration-300 ease-in-out relative z-20"
    >
      <div class="flex flex-col h-full overflow-hidden">
        <div class="flex items-center justify-between mb-4 px-1">
          <button
            id="toggle-sidebar-btn"
            class="p-2 hover:bg-[#212121] rounded-lg text-[#b4b4b4] hover:text-white transition"
          >
            <i data-lucide="panel-left" class="w-5 h-5"></i>
          </button>
          <button
            id="new-chat-btn"
            class="flex items-center gap-2 px-3 py-1.5 hover:bg-[#212121] rounded-lg text-sm text-[#ececec] font-medium transition"
          >
            <i data-lucide="square-pen" class="w-4 h-4"></i>
            <span>New chat</span>
          </button>
        </div>

        <div class="flex-1 overflow-y-auto space-y-4 px-1 text-xs text-[#b4b4b4]">
          <div>
            <div class="font-medium px-2 py-1 text-[#8e8e8e]">Today</div>
            <div class="space-y-0.5 mt-1">
              <button
                class="w-full text-left px-2 py-2 rounded-lg hover:bg-[#212121] text-[#ececec] truncate transition flex items-center justify-between group"
              >
                <span class="truncate">Next.js & Voice Orb Integration</span>
                <i
                  data-lucide="more-horizontal"
                  class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 transition"
                ></i>
              </button>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-[#262626]">
          <button
            class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-[#212121] transition"
          >
            <div
              class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-600 to-blue-500 flex items-center justify-center text-white text-xs font-bold"
            >
              U
            </div>
            <div class="flex-1 text-left">
              <div class="text-sm font-medium text-[#ececec] leading-tight">My Account</div>
              <div class="text-xs text-[#8e8e8e]">Plus Member</div>
            </div>
            <i data-lucide="more-horizontal" class="w-4 h-4 text-[#8e8e8e]"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#212121]">
      <header class="h-14 flex items-center justify-between px-4 z-10">
        <div class="flex items-center gap-2">
          <button
            id="open-sidebar-btn"
            class="p-2 hover:bg-[#2f2f2f] rounded-lg text-[#b4b4b4] hover:text-white transition hidden"
          >
            <i data-lucide="panel-left" class="w-5 h-5"></i>
          </button>
          <button
            class="flex items-center gap-2 px-3 py-1.5 rounded-xl hover:bg-[#2f2f2f] text-lg font-semibold text-[#ececec] transition group"
          >
            <span>ChatGPT</span>
            <span class="text-xs font-normal text-[#8e8e8e] group-hover:text-[#ececec]">4o</span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-[#8e8e8e]"></i>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button
            class="p-2 hover:bg-[#2f2f2f] rounded-lg text-[#b4b4b4] hover:text-white transition"
          >
            <i data-lucide="share" class="w-4 h-4"></i>
          </button>
          <button
            class="p-2 hover:bg-[#2f2f2f] rounded-lg text-[#b4b4b4] hover:text-white transition"
          >
            <i data-lucide="more-horizontal" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Chat Messages Viewport -->
      <div id="messages-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6">
        <div class="max-w-2xl mx-auto space-y-6">
          <div id="welcome-state" class="text-center pt-24 pb-12">
            <h1 class="text-3xl font-semibold text-white tracking-tight mb-8">
              What can I help with today?
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
              <button
                class="suggestion-card p-4 rounded-2xl border border-[#333] hover:bg-[#2a2a2a] transition flex flex-col gap-1"
              >
                <span class="text-sm font-medium text-[#ececec]">Design a Voice Mode UI</span>
                <span class="text-xs text-[#8e8e8e]"
                  >Fluid organic 3D canvas orb with reactive speech states</span
                >
              </button>
              <button
                class="suggestion-card p-4 rounded-2xl border border-[#333] hover:bg-[#2a2a2a] transition flex flex-col gap-1"
              >
                <span class="text-sm font-medium text-[#ececec]">Build a React Chat Interface</span>
                <span class="text-xs text-[#8e8e8e]"
                  >Markdown streaming, collapsible sidebar, and bottom dock</span
                >
              </button>
            </div>
          </div>

          <div id="chat-stream" class="space-y-6 hidden"></div>
        </div>
      </div>

      <!-- Bottom Input Container -->
      <div class="p-4 md:pb-6 max-w-2xl w-full mx-auto relative z-10">
        <div
          class="bg-[#2f2f2f] rounded-3xl border border-[#3e3e3e] shadow-lg p-2.5 flex flex-col focus-within:border-[#525252] transition"
        >
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Message ChatGPT..."
            class="w-full bg-transparent px-3 pt-1 pb-2 text-sm text-white placeholder-[#8e8e8e] resize-none outline-none max-h-48 leading-relaxed"
          ></textarea>

          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-1">
              <button
                class="p-2 hover:bg-[#3d3d3d] rounded-full text-[#b4b4b4] hover:text-white transition"
              >
                <i data-lucide="paperclip" class="w-4 h-4"></i>
              </button>
              <button
                class="p-2 hover:bg-[#3d3d3d] rounded-full text-[#b4b4b4] hover:text-white transition"
              >
                <i data-lucide="globe" class="w-4 h-4"></i>
              </button>
              <button
                class="p-2 hover:bg-[#3d3d3d] rounded-full text-[#b4b4b4] hover:text-white transition"
              >
                <i data-lucide="lightbulb" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="flex items-center gap-2">
              <!-- VOICE MODE BUTTON -->
              <button
                id="launch-voice-btn"
                class="flex items-center gap-1.5 px-3 py-1.5 bg-[#3d3d3d] hover:bg-[#4a4a4a] text-white rounded-full text-xs font-medium transition shadow-sm group"
              >
                <i
                  data-lucide="headphones"
                  class="w-3.5 h-3.5 group-hover:scale-110 transition-transform"
                ></i>
                <span>Voice</span>
              </button>

              <button
                id="send-msg-btn"
                class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center disabled:opacity-40 disabled:bg-[#444] disabled:text-[#888] hover:bg-neutral-200 transition"
                disabled
              >
                <i data-lucide="arrow-up" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="text-[11px] text-center text-[#8e8e8e] mt-2">
          ChatGPT can make mistakes. Check important info.
        </div>
      </div>
    </main>

    <!-- VOICE MODE OVERLAY -->
    <div
      id="voice-overlay"
      class="fixed inset-0 bg-[#0d0d0d] z-50 flex flex-col justify-between p-6 transition-all duration-500 opacity-0 pointer-events-none scale-95"
    >
      <div class="flex items-center justify-between w-full max-w-4xl mx-auto">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
          <span class="text-sm font-semibold tracking-wide text-[#b4b4b4]"
            >ChatGPT Advanced Voice</span
          >
          <span
            class="text-xs px-2 py-0.5 rounded-full bg-[#1e1e1e] text-[#8e8e8e] border border-[#2e2e2e]"
            >Sol</span
          >
        </div>

        <div class="flex items-center gap-1 bg-[#1a1a1a] p-1 rounded-full border border-[#2a2a2a]">
          <button
            id="state-listening-btn"
            class="px-3 py-1 rounded-full text-xs font-medium bg-[#2a2a2a] text-white transition"
          >
            Listening
          </button>
          <button
            id="state-thinking-btn"
            class="px-3 py-1 rounded-full text-xs font-medium text-[#8e8e8e] hover:text-white transition"
          >
            Thinking
          </button>
          <button
            id="state-speaking-btn"
            class="px-3 py-1 rounded-full text-xs font-medium text-[#8e8e8e] hover:text-white transition"
          >
            Speaking
          </button>
        </div>

        <button
          id="exit-voice-btn"
          class="p-2.5 rounded-full bg-[#1a1a1a] hover:bg-[#282828] text-[#b4b4b4] hover:text-white border border-[#2a2a2a] transition shadow-md"
        >
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Fluid Orb -->
      <div class="flex-1 flex flex-col items-center justify-center relative my-auto">
        <div class="absolute w-[360px] h-[360px] rounded-full voice-glow pointer-events-none"></div>
        <canvas
          id="orb-canvas"
          width="460"
          height="460"
          class="relative z-10 cursor-pointer"
        ></canvas>

        <div class="mt-8 text-center max-w-md z-10 space-y-2">
          <div
            id="voice-status-text"
            class="text-xs tracking-widest uppercase text-[#8e8e8e] font-mono"
          >
            Listening to your voice...
          </div>
          <div
            id="voice-transcript"
            class="text-lg md:text-xl font-medium text-white/90 leading-relaxed min-h-[3rem] transition-all"
          >
            "I'm listening. Ask me anything or tap to speak."
          </div>
        </div>
      </div>

      <!-- Voice Control Dock -->
      <div class="w-full max-w-md mx-auto flex items-center justify-center gap-6 pb-4 z-10">
        <button
          class="w-12 h-12 p-3 rounded-full bg-[#1e1e1e] hover:bg-[#2c2c2c] text-[#b4b4b4] hover:text-white border border-[#2e2e2e] transition shadow-lg"
        >
          <i data-lucide="video" class="w-5 h-5"></i>
        </button>
        <button
          id="mic-toggle-btn"
          class="w-16 h-16 rounded-full bg-[#2a2a2a] hover:bg-[#353535] text-white flex items-center justify-center border border-[#3e3e3e] transition shadow-xl group"
        >
          <i
            id="mic-icon"
            data-lucide="mic"
            class="w-7 h-7 text-blue-400 group-hover:scale-105 transition"
          ></i>
        </button>
        <button
          id="end-voice-call-btn"
          class="w-12 h-12 p-3 rounded-full bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-800/40 transition shadow-lg"
        >
          <i data-lucide="phone-off" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <script>
      lucide.createIcons();

      const sidebar = document.getElementById("sidebar");
      const toggleSidebarBtn = document.getElementById("toggle-sidebar-btn");
      const openSidebarBtn = document.getElementById("open-sidebar-btn");
      const chatInput = document.getElementById("chat-input");
      const sendMsgBtn = document.getElementById("send-msg-btn");
      const welcomeState = document.getElementById("welcome-state");
      const chatStream = document.getElementById("chat-stream");
      const messagesContainer = document.getElementById("messages-container");
      const suggestionCards = document.querySelectorAll(".suggestion-card");

      const launchVoiceBtn = document.getElementById("launch-voice-btn");
      const exitVoiceBtn = document.getElementById("exit-voice-btn");
      const endVoiceCallBtn = document.getElementById("end-voice-call-btn");
      const voiceOverlay = document.getElementById("voice-overlay");
      const micToggleBtn = document.getElementById("mic-toggle-btn");
      const micIcon = document.getElementById("mic-icon");
      const voiceStatusText = document.getElementById("voice-status-text");
      const voiceTranscript = document.getElementById("voice-transcript");
      const stateListeningBtn = document.getElementById("state-listening-btn");
      const stateThinkingBtn = document.getElementById("state-thinking-btn");
      const stateSpeakingBtn = document.getElementById("state-speaking-btn");
      const orbCanvas = document.getElementById("orb-canvas");
      const ctx = orbCanvas.getContext("2d");

      toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.add("-ml-64");
        openSidebarBtn.classList.remove("hidden");
      });
      openSidebarBtn.addEventListener("click", () => {
        sidebar.classList.remove("-ml-64");
        openSidebarBtn.classList.add("hidden");
      });

      chatInput.addEventListener("input", () => {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 180) + "px";
        sendMsgBtn.disabled = chatInput.value.trim() === "";
      });

      function submitMessage(text) {
        if (!text) return;
        welcomeState.classList.add("hidden");
        chatStream.classList.remove("hidden");

        const userBubble = document.createElement("div");
        userBubble.className = "flex justify-end";
        userBubble.innerHTML = `<div class="bg-[#2f2f2f] text-white px-4 py-2.5 rounded-2xl max-w-[80%] text-sm">${text}</div>`;
        chatStream.appendChild(userBubble);

        chatInput.value = "";
        chatInput.style.height = "auto";
        sendMsgBtn.disabled = true;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      sendMsgBtn.addEventListener("click", () => submitMessage(chatInput.value.trim()));
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          submitMessage(chatInput.value.trim());
        }
      });

      suggestionCards.forEach((card) => {
        card.addEventListener("click", () =>
          submitMessage(card.querySelector("span:first-child").innerText),
        );
      });

      // Voice State
      let voiceState = "listening";
      let isMuted = false;
      let voiceActive = false;

      function openVoiceMode() {
        voiceActive = true;
        voiceOverlay.classList.remove("opacity-0", "pointer-events-none", "scale-95");
        voiceOverlay.classList.add("opacity-100", "scale-100");
        setVoiceState("listening");
      }

      function closeVoiceMode() {
        voiceActive = false;
        voiceOverlay.classList.remove("opacity-100", "scale-100");
        voiceOverlay.classList.add("opacity-0", "pointer-events-none", "scale-95");
      }

      launchVoiceBtn.addEventListener("click", openVoiceMode);
      exitVoiceBtn.addEventListener("click", closeVoiceMode);
      endVoiceCallBtn.addEventListener("click", closeVoiceMode);

      micToggleBtn.addEventListener("click", () => {
        isMuted = !isMuted;
        if (isMuted) {
          micIcon.setAttribute("data-lucide", "mic-off");
          micIcon.classList.replace("text-blue-400", "text-red-400");
          voiceStatusText.innerText = "Microphone muted";
        } else {
          micIcon.setAttribute("data-lucide", "mic");
          micIcon.classList.replace("text-red-400", "text-blue-400");
          setVoiceState(voiceState);
        }
        lucide.createIcons();
      });

      function setVoiceState(state) {
        voiceState = state;
        [stateListeningBtn, stateThinkingBtn, stateSpeakingBtn].forEach((b) =>
          b.classList.remove("bg-[#2a2a2a]", "text-white"),
        );
        if (state === "listening") {
          stateListeningBtn.classList.add("bg-[#2a2a2a]", "text-white");
          voiceStatusText.innerText = "Listening to your voice...";
          voiceTranscript.innerText = '"I\'m listening. Say anything..."';
        } else if (state === "thinking") {
          stateThinkingBtn.classList.add("bg-[#2a2a2a]", "text-white");
          voiceStatusText.innerText = "Thinking...";
          voiceTranscript.innerText = '"Synthesizing answer..."';
        } else {
          stateSpeakingBtn.classList.add("bg-[#2a2a2a]", "text-white");
          voiceStatusText.innerText = "ChatGPT Speaking...";
          voiceTranscript.innerText = '"Here is how you can use this design..."';
        }
      }

      stateListeningBtn.addEventListener("click", () => setVoiceState("listening"));
      stateThinkingBtn.addEventListener("click", () => setVoiceState("thinking"));
      stateSpeakingBtn.addEventListener("click", () => setVoiceState("speaking"));

      // Canvas Orb Render Loop
      let angle = 0;
      const centerX = orbCanvas.width / 2;
      const centerY = orbCanvas.height / 2;
      const baseRadius = 110;

      function renderOrb() {
        ctx.clearRect(0, 0, orbCanvas.width, orbCanvas.height);
        if (voiceActive) {
          angle += voiceState === "speaking" ? 0.05 : voiceState === "thinking" ? 0.03 : 0.018;
        }

        let color1 = "rgba(59, 130, 246, 0.85)";
        let color2 = "rgba(147, 197, 253, 0.7)";
        let deformAmount = isMuted ? 4 : 12;

        if (voiceState === "thinking") {
          color1 = "rgba(168, 85, 247, 0.85)";
          color2 = "rgba(216, 180, 254, 0.7)";
          deformAmount = 8;
        } else if (voiceState === "speaking") {
          color1 = "rgba(244, 244, 245, 0.95)";
          color2 = "rgba(96, 165, 250, 0.85)";
          deformAmount = 24;
        }

        for (let layer = 3; layer >= 1; layer--) {
          ctx.beginPath();
          const layerRadius = baseRadius + layer * 6;
          const points = 36;
          for (let i = 0; i <= points; i++) {
            const theta = (i / points) * Math.PI * 2;
            const noise =
              Math.sin(theta * 3 + angle * 2 + layer) * Math.cos(theta * 2 - angle) * deformAmount;
            const r = layerRadius + noise;
            const x = centerX + Math.cos(theta) * r;
            const y = centerY + Math.sin(theta) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();

          const grad = ctx.createRadialGradient(
            centerX - 25,
            centerY - 25,
            10,
            centerX,
            centerY,
            layerRadius + deformAmount,
          );
          grad.addColorStop(0, color2);
          grad.addColorStop(0.5, color1);
          grad.addColorStop(1, "rgba(0,0,0,0)");

          ctx.fillStyle = grad;
          ctx.shadowColor = color1;
          ctx.shadowBlur = layer * 18;
          ctx.fill();
        }

        requestAnimationFrame(renderOrb);
      }
      renderOrb();
    </script>
  </body>
</html>
